# Copy this file, adjust the values for your cluster, and keep the copy outside the repository.
#   aedt_test_pipeline --site site.toml --reference-version 242 --test-version 261 \
#       --config-folder ./examples/configs_cluster

[site]
working_dir = "/path/to/work"                      # required, used as SLURM --chdir
reference_folder = "/path/to/work/results/reference_folder"
out_dir = "/path/to/work/results"
poll_interval = 30                                 # seconds between sacct polls
max_parallel_jobs = 2                              # omit or 0 for no limit

# Scheduler backend; only "slurm" is supported (and the default if omitted).
[site.scheduler]
type = "slurm"

# Fallback SLURM settings; per-project [project.slurm] tables take precedence.
[site.slurm]
partition = "your-partition"
mail_user = "you@example.com"
mail_type = "BEGIN,END,FAIL"

# One table per AEDT version, the name must match --reference-version / --test-version.
# ANSYSEM_ROOT<version> and (on Linux) LD_LIBRARY_PATH default to root automatically, and stale
# ANSYSEM_ROOT*/ANSYS_DESKTOP* variables are cleared. env is optional and only needed to
# override these or to set extra variables.
[site.aedt_versions.261]
root = "/path/to/ansys/v261/AnsysEM"

[site.aedt_versions.242]
root = "/path/to/ansys/v242/Linux64"
# env = { SOME_EXTRA_VARIABLE = "value" }
